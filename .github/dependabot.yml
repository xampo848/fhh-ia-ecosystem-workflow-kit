version: 2
updates:
  # The repo only has bun.lock; the npm ecosystem would not update it. Dependabot
  # supports bun for version updates only (no security updates): vulnerable
  # dependencies are caught by `bun run check:security` in CI.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ci"